{% macro rpt_layout_toolbar(spec) %}
<form method="post" action="/reports/layout" class="rpt-layout-form" data-testid="reports-layout-{{ spec.id }}">
  <input type="hidden" name="card" value="{{ spec.id }}">
  <input type="hidden" name="days" value="{{ days }}">
  {% if spec.pinned %}
  <button type="submit" name="action" value="unpin" class="rpt-layout-btn is-pinned" title="Unpin {{ spec.title }}" aria-label="Unpin {{ spec.title }}" aria-pressed="true" data-testid="reports-layout-pin-{{ spec.id }}">★</button>
  {% else %}
  <button type="submit" name="action" value="pin" class="rpt-layout-btn" title="Pin {{ spec.title }} to top" aria-label="Pin {{ spec.title }}" aria-pressed="false" data-testid="reports-layout-pin-{{ spec.id }}">☆</button>
  {% endif %}
  <button type="submit" name="action" value="up" class="rpt-layout-btn" {% if spec.first %}disabled{% endif %} title="Move up" aria-label="Move {{ spec.title }} up" data-testid="reports-layout-up-{{ spec.id }}">↑</button>
  <button type="submit" name="action" value="down" class="rpt-layout-btn" {% if spec.last %}disabled{% endif %} title="Move down" aria-label="Move {{ spec.title }} down" data-testid="reports-layout-down-{{ spec.id }}">↓</button>
  <button type="submit" name="action" value="hide" class="rpt-layout-btn" title="Hide {{ spec.title }}" aria-label="Hide {{ spec.title }}" data-testid="reports-layout-hide-{{ spec.id }}">Hide</button>
</form>
{% endmacro %}
