name: Tests

on:
  push:
    branches:
      - main
      - "v*-dev"
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.lock.txt"
      - "requirements.runtime.lock.txt"
      - ".github/workflows/**"
      - "Dockerfile"
      - "Dockerfile.nmap"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "scripts/check_supply_pins.py"
      - "scripts/check_prom_rules.py"
      - "contrib/**"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.lock.txt"
      - "requirements.runtime.lock.txt"
      - ".github/workflows/**"
      - "Dockerfile"
      - "Dockerfile.nmap"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "scripts/check_supply_pins.py"
      - "scripts/check_prom_rules.py"
      - "contrib/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            pyproject.toml

      - name: Install locked deps + package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pinned + hashed transitive set (from uv.lock export)
          pip install --require-hashes -r requirements.lock.txt
          # Project only — do not re-resolve third-party deps
          pip install --no-deps -e .
          # Coverage reporter (not hashed in lock; CI fail-under 90)
          pip install "pytest-cov>=5.0"

      - name: Install promtool
        run: |
          curl -fsSL -o /tmp/prometheus.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz"
          mkdir -p /tmp/promtool-v2.55.1
          tar -C /tmp/promtool-v2.55.1 --strip-components=1 -xzf /tmp/prometheus.tgz \
            prometheus-2.55.1.linux-amd64/promtool
          echo "PROMTOOL=/tmp/promtool-v2.55.1/promtool" >> "$GITHUB_ENV"

      - name: Run unit tests
        env:
          # Must be a *valid* Fernet key. Empty string used to break --cov import order
          # (Settings cached with KEY="" before conftest could regenerate).
          # Unit-test only — not a production secret.
          PIHERDER_MASTER_KEY: "vf4uXbk1CDlP49homyiHbTOaGu1Z6yXgsLe0NlE8L6Y="
          DATABASE_URL: "postgresql://piherder:piherder@localhost:5432/piherder"
          SECRET_KEY: "ci-unit-test-secret-key-not-for-production-use"
        run: |
          pytest -q --tb=short \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          python -m pip install "ruff==0.15.21"
          ruff check app tests migrations

      - name: Pinned actions and base images
        run: python3 scripts/check_supply_pins.py

      - name: Prometheus rules
        run: |
          curl -fsSL -o /tmp/prometheus.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz"
          mkdir -p /tmp/promtool-v2.55.1
          tar -C /tmp/promtool-v2.55.1 --strip-components=1 -xzf /tmp/prometheus.tgz \
            prometheus-2.55.1.linux-amd64/promtool
          PROMTOOL=/tmp/promtool-v2.55.1/promtool python3 scripts/check_prom_rules.py

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: piherder
          POSTGRES_PASSWORD: piherder
          POSTGRES_DB: piherder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piherder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            pyproject.toml

      - name: Install locked deps + package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-deps -e .

      - name: Upgrade to head, then downgrade to base
        env:
          PIHERDER_MASTER_KEY: "vf4uXbk1CDlP49homyiHbTOaGu1Z6yXgsLe0NlE8L6Y="
          DATABASE_URL: "postgresql://piherder:piherder@localhost:5432/piherder"
          SECRET_KEY: "ci-unit-test-secret-key-not-for-production-use"
          DATA_ROOT: "/tmp/piherder-ci-data"
          BACKUP_ROOT: "/tmp/piherder-ci-backups"
          HERDER_BACKUP_ROOT: "/tmp/piherder-ci-herder"
        run: |
          set -euo pipefail
          mkdir -p "$DATA_ROOT" "$BACKUP_ROOT" "$HERDER_BACKUP_ROOT"
          alembic upgrade head
          alembic downgrade base
